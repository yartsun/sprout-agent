[project]
name = "sprout-agent"
version = "0.1.0"
description = "A small local AI agent: any OpenAI-compatible model, web search, page reading, vision, workspace files, MCP tools and a sandboxed code runner"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Bohdan Yartsun" }]
keywords = ["llm", "agent", "mcp", "ollama", "llama.cpp", "tool-calling", "fastapi"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "lxml_html_clean>=0.1",
    "ddgs>=9.0",
    "pillow>=10.4",
    "mcp>=1.20,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sprout = "sprout.__main__:main"

[project.urls]
Homepage = "https://github.com/yartsun/sprout-agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sprout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sandbox: needs Docker and the sprout-sandbox image (SANDBOX_TESTS=1)"]

[tool.ruff]
line-length = 135
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
