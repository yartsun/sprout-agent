<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprout</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root { --bg:#f6f5f2; --panel:#fff; --text:#1d1d1b; --muted:#77756f; --line:#e4e2dc;
          --accent:#2f6b4f; --user:#e8f0eb; --tool:#f1efe9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161715; --panel:#1f201e; --text:#ecebe6; --muted:#9a988f; --line:#33342f;
            --accent:#6fbf93; --user:#22332a; --tool:#262723; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.55 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
         height:100dvh; display:flex; flex-direction:column; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  header h1 { font-size:16px; margin:0; font-weight:600; display:flex; align-items:center; gap:8px; }
  header h1 span { color:var(--accent); }
  #status { font-size:12px; color:var(--muted); margin-left:auto; }
  #status.ok::before { content:"●"; color:var(--accent); margin-right:4px; }
  #status.bad::before { content:"●"; color:#c0533a; margin-right:4px; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px;
          max-width:860px; width:100%; margin:0 auto; }
  .empty { margin:auto; text-align:center; color:var(--muted); max-width:460px; }
  .empty h2 { color:var(--text); font-size:20px; margin:0 0 6px; }
  .examples { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px; }
  .examples button { height:auto; padding:8px 12px; background:var(--panel); border:1px solid var(--line);
                     color:var(--text); font-size:13px; border-radius:999px; }
  .msg { padding:10px 14px; border-radius:14px; max-width:100%; overflow-wrap:anywhere; }
  .user { background:var(--user); align-self:flex-end; max-width:85%; white-space:pre-wrap; }
  .bot { background:var(--panel); border:1px solid var(--line); }
  .bot pre { background:var(--tool); padding:10px; border-radius:8px; overflow-x:auto; }
  .bot p:first-child { margin-top:0; } .bot p:last-child { margin-bottom:0; }
  .bot a { color:var(--accent); }
  .step { font-size:13px; color:var(--muted); background:var(--tool); border-radius:8px;
          padding:6px 10px; overflow-wrap:anywhere; }
  .step a { color:var(--accent); }
  .msg img, .step img { max-width:min(100%, 320px); border-radius:8px; display:block; margin-top:6px; }
  .thinking { color:var(--muted); font-size:13px; }
  .thinking::after { content:"…"; animation:blink 1.2s infinite; }
  @keyframes blink { 50% { opacity:.2; } }
  form { border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:var(--bg); }
  .row { display:flex; gap:8px; max-width:860px; margin:0 auto; align-items:flex-end; }
  textarea { flex:1; resize:none; min-height:44px; max-height:180px; padding:11px 12px; border:1px solid var(--line);
             border-radius:12px; background:var(--panel); color:var(--text); font:inherit; }
  button { height:44px; min-width:44px; border:0; border-radius:12px; cursor:pointer; font:inherit; }
  #send { background:var(--accent); color:#fff; padding:0 16px; font-weight:600; }
  #send:disabled { opacity:.5; }
  #attach { background:var(--panel); border:1px solid var(--line); color:var(--text); font-size:18px; }
  #preview { max-width:860px; margin:0 auto 8px; display:flex; gap:6px; flex-wrap:wrap; }
  #preview img { height:56px; border-radius:8px; }
  #clear { background:none; color:var(--muted); font-size:13px; height:auto; }
</style>
</head>
<body>
<header>
  <h1><span>🌱</span> Sprout</h1>
  <button id="clear" title="Start a new chat">New chat</button>
  <span id="status">checking…</span>
</header>
<div id="chat">
  <div class="empty" id="empty">
    <h2>A local agent with tools</h2>
    <div>It can search the web, read pages, look at images, keep files in your workspace and use MCP servers.</div>
    <div class="examples">
      <button type="button">What changed in the latest Python release? Cite sources.</button>
      <button type="button">Summarize https://example.com in three bullet points</button>
      <button type="button">Write a CSV of the 5 largest EU countries by area and save it</button>
    </div>
  </div>
</div>
<form id="form">
  <div id="preview"></div>
  <div class="row">
    <button type="button" id="attach" title="Attach images">＋</button>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <textarea id="input" rows="1" placeholder="Ask, paste a link or attach an image"></textarea>
    <button id="send" aria-label="Send">→</button>
  </div>
</form>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const fileInput = document.getElementById('file');
const preview = document.getElementById('preview');
const attach = document.getElementById('attach');
let history = [];
let pending = [];

const md = text => DOMPurify.sanitize(marked.parse(text || ''));
const scroll = () => (chat.scrollTop = chat.scrollHeight);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
function add(cls, html) {
  document.getElementById('empty')?.remove();
  const node = document.createElement('div');
  node.className = cls;
  node.innerHTML = html;
  chat.appendChild(node);
  scroll();
  return node;
}

async function checkHealth() {
  const status = document.getElementById('status');
  try {
    const health = await (await fetch('/api/health')).json();
    status.className = health.llm ? 'ok' : 'bad';
    status.textContent = health.llm ? health.model : `${health.model} is not reachable`;
  } catch {
    status.className = 'bad';
    status.textContent = 'server is not reachable';
  }
}
checkHealth();
setInterval(checkHealth, 15000);
fetch('/api/tools').then(r => r.json()).then(info => { if (!info.vision) attach.hidden = true; });

// Images are resized to 1024 px in the browser before they are sent.
function resize(file) {
  return new Promise(resolve => {
    const image = new Image();
    image.onload = () => {
      const k = Math.min(1, 1024 / Math.max(image.width, image.height));
      const canvas = document.createElement('canvas');
      canvas.width = image.width * k;
      canvas.height = image.height * k;
      canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', 0.85));
    };
    image.src = URL.createObjectURL(file);
  });
}
attach.onclick = () => fileInput.click();
fileInput.onchange = async () => {
  for (const file of fileInput.files) pending.push(await resize(file));
  fileInput.value = '';
  preview.innerHTML = pending.map(src => `<img src="${src}" alt="">`).join('');
};
document.getElementById('clear').onclick = () => location.reload();
document.querySelectorAll('.examples button').forEach(b => (b.onclick = () => { input.value = b.textContent; send(); }));

input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; });
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); send(); }
});
document.getElementById('form').onsubmit = e => { e.preventDefault(); send(); };

// Models sometimes send booleans as strings; "False" must read as false here too.
const truthy = v => v === true || String(v).trim().toLowerCase() === 'true';
const toolLabel = (name, a) => ({
  web_search: `🔎 Searching: ${esc(a.query || '')}`,
  open_url: `🌐 Opening: ${esc(a.url || '')}`,
  view_image: `🖼 Looking at: ${esc(a.url || '')}`,
  list_files: `📂 Listing files: ${esc(a.path || '.')}`,
  read_file: `📄 Reading: ${esc(a.path || '')}`,
  write_file: `📝 ${truthy(a.append) ? 'Appending to' : 'Writing'} <a href="/files/${encodeURI(a.path || '')}" target="_blank" rel="noopener">${esc(a.path || '')}</a>`,
}[name] || (name.includes('__')
  ? `🔌 ${esc(name.split('__')[0])}: ${esc(name.split('__').slice(1).join('__'))}`
  : `⚙️ ${esc(name)}`));

async function send() {
  const text = input.value.trim();
  if ((!text && !pending.length) || sendBtn.disabled) return;
  const content = pending.length
    ? [{type: 'text', text: text || 'What is in this image?'}, ...pending.map(url => ({type: 'image_url', image_url: {url}}))]
    : text;
  add('msg user', esc(text) + pending.map(src => `<img src="${src}" alt="">`).join(''));
  history.push({role: 'user', content});
  input.value = '';
  input.style.height = 'auto';
  pending = [];
  preview.innerHTML = '';
  sendBtn.disabled = true;
  const wait = add('thinking', 'thinking');
  const before = node => chat.insertBefore(node, wait);
  try {
    const response = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({messages: history}),
    });
    if (!response.ok) throw new Error((await response.json()).detail || response.statusText);
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const parts = buffer.split('\n\n');
      buffer = parts.pop();
      for (const part of parts) {
        if (!part.startsWith('data: ')) continue;
        const event = JSON.parse(part.slice(6));
        if (event.type === 'tool') before(Object.assign(document.createElement('div'), {className: 'step', innerHTML: toolLabel(event.name, event.args)}));
        else if (event.type === 'image') before(Object.assign(document.createElement('div'), {className: 'step', innerHTML: `<img src="${event.src}" alt="">`}));
        else if (event.type === 'answer') { add('msg bot', md(event.content)); history.push({role: 'assistant', content: event.content}); }
        else if (event.type === 'error') add('msg bot', `<b>Error:</b> ${esc(event.content)}`);
        scroll();
      }
    }
  } catch (error) {
    add('msg bot', `<b>Error:</b> ${esc(error.message)}`);
  }
  wait.remove();
  sendBtn.disabled = false;
  input.focus();
}
</script>
</body>
</html>
